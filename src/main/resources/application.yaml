spring:
  application:
    name: virtual-threads-lab
  threads:
    virtual:
      enabled: true # Tomcat request handling, @Async and task executors run on virtual threads
      max-virtual-threads: 1000 # Maximum number of virtual threads to create
  datasource:
    # Overridden automatically by Spring's docker-compose support when running from the host,
    # and by SPRING_DATASOURCE_* in the containers.
    url: jdbc:postgresql://localhost:5432/vtlab
    username: vtlab
    password: vtlab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway (db/migration)
    properties:
      hibernate:
  data:
    web:
      pageable:
        max-page-size: 100

logging:
  pattern:
    # traceId/spanId come from Micrometer Tracing via the MDC (blank outside a traced scope)
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${spring.application.name} [traceId=%X{traceId:-} spanId=%X{spanId:-}] [%t] %-36.36logger{35} : %m%n%wEx"
  level:
    com.cloudwalkers.virtualthreadslab: INFO
    # handled exceptions are logged by GlobalExceptionHandler; skip Spring's duplicate WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  sample-data:
    enabled: true
