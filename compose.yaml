name: virtual-threads-lab

services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'

  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: vtlab
      POSTGRES_USER: vtlab
      POSTGRES_PASSWORD: vtlab
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vtlab -d vtlab']
      interval: 3s
      timeout: 3s
      retries: 20

  # Dev-mode app container: `docker compose --profile dev up`
  # Runs `./gradlew bootRun` against the mounted sources and recompiles on change, so
  # Spring Boot DevTools restarts the app automatically. The profile keeps this service
  # out of the way when you run the app from the host (Spring's docker-compose support
  # only starts services without a profile).
  app-dev:
    profiles: ['dev']
    image: 'eclipse-temurin:21-jdk'
    working_dir: /app
    command: >
      sh -c "./gradlew --console=plain --continuous -q classes &
             exec ./gradlew --console=plain bootRun"
    ports:
      - '8080:8080'
      - '5005:5005' # JDWP remote debugging
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DOCKER_COMPOSE_ENABLED: 'false' # we are already inside compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vtlab
      SPRING_DATASOURCE_USERNAME: vtlab
      SPRING_DATASOURCE_PASSWORD: vtlab
      SPRING_THREADS_VIRTUAL_ENABLED: ${VIRTUAL_THREADS:-true} # VIRTUAL_THREADS=false to compare with platform threads
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://grafana-lgtm:4318/v1/metrics
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/logs
      GRADLE_USER_HOME: /gradle-home
      DEBUG_JVM: 'true'
    volumes:
      - .:/app
      - gradle-home:/gradle-home # dependency cache survives restarts
      - app-gradle:/app/.gradle # keep container build state apart from the host's
      - app-build:/app/build
    depends_on:
      grafana-lgtm:
        condition: service_started
      postgres:
        condition: service_healthy

  # Production-style image built from the Dockerfile: `docker compose --profile prod up --build`
  app:
    profiles: ['prod']
    build: .
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vtlab
      SPRING_DATASOURCE_USERNAME: vtlab
      SPRING_DATASOURCE_PASSWORD: vtlab
      SPRING_THREADS_VIRTUAL_ENABLED: ${VIRTUAL_THREADS:-true} # VIRTUAL_THREADS=false to compare with platform threads
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://grafana-lgtm:4318/v1/metrics
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://grafana-lgtm:4318/v1/logs
    depends_on:
      grafana-lgtm:
        condition: service_started
      postgres:
        condition: service_healthy

  # Load generator: `docker compose --profile dev --profile load run --rm k6`
  k6:
    profiles: ['load']
    image: 'grafana/k6:latest'
    command: run /scripts/stress.js
    environment:
      BASE_URL: http://app-dev:8080
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      - app-dev

volumes:
  postgres-data:
  gradle-home:
  app-gradle:
  app-build:
